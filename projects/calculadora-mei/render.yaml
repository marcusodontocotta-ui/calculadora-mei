services:
  - type: web
    name: calculadora-mei
    runtime: docker
    plan: free
    dockerfilePath: projects/calculadora-mei/Dockerfile
    dockerContext: projects/calculadora-mei
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sisgersa-db
          property: connectionString
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
