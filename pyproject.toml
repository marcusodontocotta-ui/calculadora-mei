[project]
name = "cupula-gestao"
version = "1.0.0"
description = "Cúpula de Gestão Autônoma — Sistema multi-agente com Setor Jurídico, AI Gateway e meta-agentes"
requires-python = ">=3.12"
authors = [
    {name = "Marcus Cotta"},
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "httpx>=0.27",
]

[project.scripts]
cupula-api = "cupula.api.main:main"
cupula-worker = "cupula.worker.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
