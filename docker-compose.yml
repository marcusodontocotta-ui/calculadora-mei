services:
  redis:
    image: redis:7-alpine
    container_name: cupula-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cupula-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: cupula-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-cupula2024}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - REDIS_HOST=redis
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - cupula-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  cupula-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cupula-api
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
      - ./sandbox:/app/sandbox
    networks:
      - cupula-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  cupula-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: cupula-worker
    environment:
      - REDIS_URL=redis://redis:6379
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
    networks:
      - cupula-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2

volumes:
  n8n_data:
  redis_data:

networks:
  cupula-network:
    driver: bridge
