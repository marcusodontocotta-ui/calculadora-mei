# =============================================================================
# Cúpula de Gestão Autônoma — Docker Compose
#
# NOTAS DE SEGURANÇA (hardening aplicado — P2):
#   * Redis exige senha (requirepass) via ${REDIS_PASSWORD}. A porta do Redis
#     só é publicada no host local (127.0.0.1:6379), não em 0.0.0.0, para não
#     expor o Redis sem auth para a rede.
#   * A API exige CUPULA_API_KEY (P1a). Defina um valor forte em .env. Sem ela,
#     as rotas protegidas responderão 503 (fail-closed).
#   * A API e o worker usam o mesmo serviço Redis autenticado via REDIS_URL.
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: cupula-redis
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass $$REDIS_PASSWORD"]
    # Somente host local; não expõe o Redis (que agora exige senha) na rede.
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      # Senha obrigatória via env. Sem default fraco: o compose falha no arranque
      # se REDIS_PASSWORD não estiver definida em .env (nunca commitar a real).
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD é obrigatória (defina em .env)}
    volumes:
      - redis_data:/data
    networks:
      - cupula-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: cupula-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      # Sem senha fraca por default: exige env N8N_PASSWORD forte (fail no arranque
      # se ausente). Gere com: python -c "import secrets; print(secrets.token_urlsafe(24))"
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:?N8N_PASSWORD é obrigatória (defina uma senha forte em .env)}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - REDIS_HOST=redis
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - cupula-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  cupula-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cupula-api
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - PYTHONUNBUFFERED=1
      - CUPULA_API_KEY=${CUPULA_API_KEY:-}
    volumes:
      - ./logs:/app/logs
      - ./sandbox:/app/sandbox
      - ./decisions:/app/decisions
    networks:
      - cupula-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  cupula-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - PYTHONUNBUFFERED=1
      # Consumidor único por réplica para evitar colisão no Redis Streams (P1c).
      - REDIS_CONSUMER_GROUP=${REDIS_CONSUMER_GROUP:-cupula-worker-group}
      - REDIS_CONSUMER_NAME=${REDIS_CONSUMER_NAME:-cupula-worker-1}
    volumes:
      - ./logs:/app/logs
    networks:
      - cupula-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2

volumes:
  n8n_data:
  redis_data:

networks:
  cupula-network:
    driver: bridge
